services:
  backend:
    image: dereksleung407/calibrate:latest
    ports:
      - "127.0.0.1:3001:3001"
    command: ["node", "/app/apps/backend/dist/startup.mjs"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - doppler_token
    volumes:
      - type: bind
        source: /srv/calibrate/.env.production
        target: /run/config/.env.production
        read_only: true
        bind:
          create_host_path: false

  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    secrets:
      - db_password

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"  # Optional: HTTP/3
    volumes:
      - ./conf:/etc/caddy:ro
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  doppler_token:
    file: /etc/calibrate/doppler-token
  db_password:
    file: /etc/calibrate/postgres-password